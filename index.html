<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotify Web Clone - Liquid Glass</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & LIQUID GLASS VARS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    :root {
      --bg-black: #050505;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-highlight: rgba(255, 255, 255, 0.18);
      --text-primary: #ffffff;
      --text-secondary: #a7a7a7;
      --spotify-green: #1ed760;
      --spotify-green-hover: #1fdf64;
      --player-height: 90px;
    }

    html, body {
      background-color: var(--bg-black);
      color: var(--text-primary);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: fixed;
      user-select: none;
      -webkit-user-select: none;
    }

    /* LIQUID AMBIENT BACKGROUND GLOW */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -2;
      opacity: 0.35;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    body::before {
      top: -100px;
      left: -100px;
      background: rgba(30, 215, 96, 0.4);
    }

    body::after {
      bottom: -100px;
      right: -100px;
      background: rgba(138, 43, 226, 0.35);
      animation-delay: -6s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 40px) scale(1.15); }
    }

    /* APP LAYOUT */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--player-height));
      padding: 10px;
      gap: 10px;
      overflow: hidden;
    }

    /* SIDEBAR GLASS */
    .sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-section, .library-section {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-primary);
    }

    .nav-item i {
      font-size: 1.4rem;
    }

    .library-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .library-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .add-playlist-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 50%;
    }

    .add-playlist-btn:hover {
      color: var(--text-primary);
      background-color: rgba(255,255,255,0.1);
    }

    .playlist-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, border 0.2s ease;
      border: 1px solid transparent;
    }

    .playlist-item:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border);
    }

    .playlist-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .playlist-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .playlist-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* MAIN CONTENT GLASS */
    .main-content {
      flex: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      -webkit-overflow-scrolling: touch;
    }

    /* TOP HEADER GLASS */
    .top-bar {
      position: sticky;
      top: 0;
      background: rgba(18, 18, 18, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid var(--glass-border);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 300px;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      color: var(--text-secondary);
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      padding: 10px 16px 10px 38px;
      border-radius: 50px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--glass-border-highlight);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.08);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      padding: 4px 14px 4px 4px;
      border-radius: 30px;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .profile-menu-container {
      position: relative;
    }

    .user-profile:hover,
    .user-profile[aria-expanded="true"] {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--glass-border-highlight);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #535353;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 220px;
      padding: 8px;
      background: rgba(24, 24, 24, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border-highlight);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      z-index: 150;
    }

    .profile-menu[hidden] {
      display: none;
    }

    .profile-menu button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-primary);
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .profile-menu button:hover,
    .profile-menu button:focus-visible {
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    .profile-menu-info {
      padding: 10px 12px;
      color: var(--text-secondary);
      font-size: 0.75rem;
      line-height: 1.5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 4px;
    }

    /* CONTENT BODY */
    .content-body {
      padding: 0 32px 32px;
    }

    .hero-banner {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      margin: 0 0 24px;
      padding: 28px 32px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 32px;
    }

    .music-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      padding: 8px 14px;
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: relative;
    }

    .music-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--glass-border);
      backdrop-filter: blur(10px);
      transform: translateY(-1px);
    }

    .card-left-content {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      overflow: hidden;
    }

    .card-img-container {
      position: relative;
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play-btn {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      opacity: 0;
      transition: opacity 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .music-card:hover .card-play-btn {
      opacity: 1;
    }

    .card-text-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      flex: 1;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .eq-bars {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      width: 14px;
    }

    .eq-bar {
      width: 3px;
      background-color: var(--spotify-green);
      animation: bounce 0.8s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }

    @keyframes bounce {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    .music-card.active-song .card-title {
      color: var(--spotify-green);
    }

    .music-card.active-song .eq-bars {
      display: flex;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-options-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      padding: 8px;
      cursor: pointer;
      border-radius: 50%;
      transition: color 0.2s;
    }

    .card-options-btn:hover {
      color: var(--text-primary);
      background-color: rgba(255,255,255,0.1);
    }

    .song-menu-popup {
      position: fixed;
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border-highlight);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      width: 220px;
      padding: 6px;
      z-index: 9999;
    }

    .song-menu-popup[hidden] {
      display: none;
    }

    .song-menu-popup button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .song-menu-popup button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* PLAYER BAR BOTTOM DESKTOP (LIQUID GLASS) */
    .player-bar {
      height: var(--player-height);
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: relative;
      z-index: 200;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 30%;
      min-width: 180px;
      cursor: pointer;
    }

    .now-playing-img {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #000;
    }

    .now-playing-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .now-playing-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .now-playing-artist {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .like-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      margin-left: 8px;
    }

    .like-btn.active {
      color: var(--spotify-green);
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 40%;
      max-width: 720px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      color: var(--text-primary);
    }

    .control-btn.active {
      color: var(--spotify-green);
    }

    .play-pause-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, background 0.15s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
    }

    .play-pause-btn:hover {
      transform: scale(1.1);
      background: #ffffff;
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .progress-bar-wrapper {
      flex: 1;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #ffffff;
      border-radius: 2px;
    }

    .progress-bar-wrapper:hover .progress-fill {
      background-color: var(--spotify-green);
    }

    .volume-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      width: 30%;
      min-width: 180px;
    }

    .volume-bar-wrapper {
      width: 100px;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .volume-bar {
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .volume-fill {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      border-radius: 2px;
    }

    .volume-bar-wrapper:hover .volume-fill {
      background-color: var(--spotify-green);
    }

    /* FULL-SCREEN PLAYER MODAL (LIQUID GLASS) */
    .full-player {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px 40px;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      touch-action: none;
    }

    .full-player.open {
      transform: translateY(0);
    }

    .full-player-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(60px) brightness(0.25);
      z-index: -1;
      transform: scale(1.2);
    }

    .full-player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-full-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .full-player-title-header {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ddd;
      text-align: center;
      flex: 1;
    }

    .full-player-cover-container {
      width: 100%;
      max-width: 360px;
      margin: 0 auto 20px;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.15);
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .full-player-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .full-player-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
    }

    .full-song-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .full-song-artist {
      font-size: 0.95rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .full-player-progress {
      width: 100%;
      max-width: 360px;
      margin: 0 auto 16px;
    }

    .full-player-controls {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      width: 100% !important;
      max-width: 360px !important;
      margin: 0 auto 24px !important;
    }

    .full-play-btn {
      width: 64px !important;
      height: 64px !important;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      border: none;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
      flex-shrink: 0;
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.35);
    }

    .full-play-btn:hover {
      transform: scale(1.08);
    }

    .full-player-bottom-actions {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      width: 100% !important;
      max-width: 360px !important;
      margin: 0 auto !important;
      color: var(--text-secondary);
    }

    .mobile-nav {
      display: none;
    }

    @media screen and (max-width: 768px) {
      .app-container {
        flex-direction: column;
        padding: 4px;
        height: calc(100vh - 135px);
        margin-bottom: 135px;
      }

      .sidebar {
        display: none;
      }

      .main-content {
        border-radius: 12px;
        flex: 1;
        overflow-y: auto;
        padding-bottom: 30px;
      }

      .top-bar {
        padding: 12px 16px;
        position: sticky;
        top: 0;
        background: rgba(18, 18, 18, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        gap: 8px;
      }

      .search-box {
        flex: 1;
        width: auto;
        min-width: 0;
      }

      .user-profile {
        padding: 4px;
        margin-left: 8px;
      }

      .user-profile > span {
        display: none;
      }

      .content-body {
        padding: 0 16px 20px;
      }

      .hero-banner {
        margin: 0 0 16px;
        padding: 16px;
      }

      .cards-grid {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 20px;
      }

      .music-card {
        padding: 6px 10px;
      }

      .player-bar {
        position: fixed;
        bottom: 60px;
        left: 0;
        width: 100%;
        height: 75px;
        padding: 0 12px;
        z-index: 250;
        background: rgba(10, 10, 10, 0.8);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
      }

      .now-playing {
        width: 70%;
        min-width: 0;
        gap: 8px;
      }

      .now-playing-img {
        width: 44px;
        height: 44px;
      }

      .player-bar .player-controls {
        width: 25%;
      }

      .player-bar .control-btn:not(#playPauseBtn) {
        display: none;
      }

      .play-pause-btn {
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }

      .volume-controls, .player-bar .progress-container {
        display: none;
      }

      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background: rgba(12, 12, 12, 0.85);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-top: 1px solid var(--glass-border);
        justify-content: space-around;
        align-items: center;
        z-index: 300;
      }

      .mobile-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: var(--text-secondary);
        font-size: 0.7rem;
        cursor: pointer;
      }

      .mobile-nav-item.active, .mobile-nav-item:hover {
        color: var(--text-primary);
      }

      .mobile-nav-item i {
        font-size: 1.2rem;
      }

      .full-player-controls .control-btn {
        display: flex !important;
        font-size: 1.3rem;
      }

      .full-play-btn {
        width: 60px !important;
        height: 60px !important;
        font-size: 1.4rem !important;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <nav class="nav-section">
        <ul class="nav-list">
          <li class="nav-item active" onclick="switchTab('home')" id="navHome"><i class="fa-solid fa-house"></i> Utama</li>
          <li class="nav-item" onclick="document.getElementById('searchInput').focus();"><i class="fa-solid fa-magnifying-glass"></i> Cari</li>
        </ul>
      </nav>

      <section class="library-section">
        <div class="library-header">
          <div class="library-title" onclick="switchTab('liked')">
            <i class="fa-solid fa-book"></i> Koleksi Kamu

            <i class="fa-solid fa-plus"></i>

    <main class="main-content">
      <header class="top-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Cari lagu atau artis...">
        </div>
        <div class="profile-menu-container">
          <button class="user-profile" id="userProfileBtn" type="button" aria-expanded="false" aria-controls="profileMenu" aria-label="Buka menu profil">
            <span class="user-avatar" id="userAvatar">
              <i class="fa-solid fa-user"></i>
            </span>
            <span id="profileName">Pengguna Pajarson</span>
          </button>
          <div class="profile-menu" id="profileMenu" role="menu" hidden>
            <div class="profile-menu-info" id="profileMenuInfo">Akun demo</div>
            <button type="button" id="accountInfoBtn" role="menuitem">Info akun</button>
            <button type="button" id="editProfileNameBtn" role="menuitem">Ubah nama</button>
            <button type="button" id="changeProfilePhotoBtn" role="menuitem">Ganti foto</button>

      <div class="content-body">

  </div>

  <div class="song-menu-popup" id="songMenuPopup" hidden>
    <button id="popupLikeBtn"><i class="fa-solid fa-heart"></i> <span id="popupLikeText">Simpan ke Lagu Disukai</span></button>
    <button id="popupAddPlaylistBtn"><i class="fa-solid fa-plus"></i> Tambahkan ke Playlist</button>
  </div>

  <nav class="mobile-nav">
    <div class="mobile-nav-item active" id="mobHome" onclick="switchTab('home')"><i class="fa-solid fa-house"></i><span>Utama</span></div>
    <div class="mobile-nav-item" onclick="document.getElementById('searchInput').focus();"><i class="fa-solid fa-magnifying-glass"></i><span>Cari</span></div>
    <div class="mobile-nav-item" id="mobLiked" onclick="switchTab('liked')"><i class="fa-solid fa-book"></i><span>Koleksi</span></div>
  </nav>

  <footer class="player-bar">
    <div class="now-playing" id="openFullPlayerBtn">
      <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&auto=format&fit=crop" id="playerImg" class="now-playing-img" alt="Cover">
      <div class="now-playing-info">
        <div class="now-playing-title" id="playerTitle">Pilih Lagu</div>

    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button class="control-btn" id="shuffleBtn" title="Acak"><i class="fa-solid fa-shuffle"></i></button>

  <div class="full-player" id="fullPlayer">

      <div class="full-player-info">

          <div class="full-song-title" id="fullSongTitle">Judul Lagu</div>

        <button class="like-btn" id="fullLikeBtn" style="font-size: 1.5rem;"><i class="fa-regular fa-heart"></i></button>

        <button class="control-btn" style="font-size: 1.3rem;" title="Acak"><i class="fa-solid fa-shuffle"></i></button>

        <button class="full-play-btn" id="fullPlayPauseBtn" title="Putar/Jeda">
          <i class="fa-solid fa-play" id="fullPlayIcon"></i>

        <button class="control-btn" style="font-size: 1.3rem;" title="Ulangi"><i class="fa-solid fa-repeat"></i></button>

        <button class="control-btn" style="font-size: 1.1rem;" title="Bagikan"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
        <button class="control-btn" style="font-size: 1.1rem;" title="Antrean"><i class="fa-solid fa-bars-staggered"></i></button>
      </div>
    </div>
  </div>

  <script>
    let songs = [
      { id: 1, title: "Live forever", artist: "oasis", cover: "image/awas.jpeg", url: "Song/oasis-live forever.mp3", liked: false },
      { id: 2, title: "Saturn", artist: "SZA", cover: "image/belum kepikiran.jpeg", url: "songgg/SZA - Saturn.mp3", liked: false },

      { id: 5, title: "Daisies", artist: "Justin Bieber", cover: "image/emm.jpeg", url: "songgg/Justin Bieber - DAISIES (Lyrics).mp3", liked: false },

      { id: 7, title: "Maher Zain - Paradise", artist: "Maher Zain", cover: "image/lagi di jalan.jpeg", url: "Song/Maher Zain - Paradise (Lyrics).mp3", liked: false },
      { id: 8, title: "Past Life", artist: "Ariana Grande", cover: "image/ketahuan.jpeg", url: "Songg/Ariana Grande - past life (lyric visualizer).mp3", liked: false },
      { id: 9, title: "One Of The Girls", artist: "The weeknd", cover: "image/kriminal.jpeg", url: "Songg/The Weeknd, JENNIE, Lily-Rose Depp - One Of The Girls (Lyrics).mp3", liked: false },
      { id: 10, title: "Circus", artist: "Altare", cover: "image/kucing penger.jpeg", url: "Song/circus.mp3", liked: false },
      { id: 11, title: "Jennifer", artist: "Trinidad Cardona", cover: "image/lagi di jalan.jpeg", url: "Song/Jennifer.mp3", liked: false },
      { id: 12, title: "Dream Girl", artist: "Realestk", cover: "image/liat tuh.jpeg", url: "Songg/RealestK - Dream Girl (Lyrics).mp3", liked: false },
      { id: 13, title: "Imperfect For You", artist: "Ariana Grande", cover: "image/standar.jpeg", url: "Song/Ariana Grande - imperfect for you (acoustic) (lyric visualizer).mp3", liked: false },
      { id: 14, title: "Telekinesis", artist: "Travis Scott", cover: "image/tidak terpancing.jpeg", url: "Songg/Travis Scott - TELEKINESIS (Lyrics) ft. SZA, Future.mp3", liked: false },
      { id: 15, title: "Bye x Circus", artist: "Britney Spears", cover: "image/nimpa dipikir.jpeg", url: "lagu/bye x Circus - Britney Spears & altare (mashup).mp3", liked: false },
      { id: 16, title: "Bye x Streets", artist: "Doja Cat & Altare", cover: "image/topik panas.jpeg", url: "lagu/bye X Streets - Doja Cat & altare (mashup).mp3", liked: false },
      { id: 17, title: "Bye x Vacation Bible School", artist: "altare & Ayesha Erotica", cover: "image/tidak terpancing.jpeg", url: "lagu/bye X Vacation Bible School - altare & Ayesha Erotica (mashup).mp3", liked: false },
      { id: 18, title: "Bye x Kiss It Better", artist: "Rihanna & Altare", cover: "image/ya otw.jpeg", url: "lagu/bye X Kiss It Better - Rihanna & altare (mashup).mp3", liked: false },
      { id: 19, title: "#Brooklynbloodpop x Vacation Bible School", artist: "Ayesha Erotica & SyKo", cover: "image/ketahuan.jpeg", url: "lagu/Brooklynbloodpop X Vacation Bible School - Ayesha Erotica & SyKo (mashup).mp3", liked: false },
      { id: 20, title: "Holy", artist: "Justin Bieber", cover: "image/belum kepikiran.jpeg", url: "songgg/Justin Bieber - Holy (Acoustic) ft. Chance The Rapper.mp3", liked: false }
    ];

    let currentView = 'home';
    let currentPlaylist = [...songs];
    let currentSongIndex = 0;
    let isPlaying = false;
    let audio = new Audio();
    let activeSongIdForMenu = null;

    // DOM ELEMENTS
    const songsGrid = document.getElementById('songsGrid');
    const playlistList = document.getElementById('playlistList');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playerImg = document.getElementById('playerImg');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');
    const progressWrapper = document.getElementById('progressWrapper');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const volumeWrapper = document.getElementById('volumeWrapper');
    const volumeFill = document.getElementById('volumeFill');
    const likeBtn = document.getElementById('likeBtn');
    const fullLikeBtn = document.getElementById('fullLikeBtn');
    const searchInput = document.getElementById('searchInput');
    const addPlaylistBtn = document.getElementById('addPlaylistBtn');
    const sectionTitle = document.getElementById('sectionTitle');
    const bannerTitle = document.getElementById('bannerTitle');
    const bannerDesc = document.getElementById('bannerDesc');
    const userProfileBtn = document.getElementById('userProfileBtn');
    const profileName = document.getElementById('profileName');
    const userAvatar = document.getElementById('userAvatar');
    const profileMenu = document.getElementById('profileMenu');
    const profileMenuInfo = document.getElementById('profileMenuInfo');
    const profilePhotoInput = document.getElementById('profilePhotoInput');
    const accountInfoBtn = document.getElementById('accountInfoBtn');
    const editProfileNameBtn = document.getElementById('editProfileNameBtn');
    const changeProfilePhotoBtn = document.getElementById('changeProfilePhotoBtn');

    const songMenuPopup = document.getElementById('songMenuPopup');
    const popupLikeBtn = document.getElementById('popupLikeBtn');
    const popupLikeText = document.getElementById('popupLikeText');
    const popupAddPlaylistBtn = document.getElementById('popupAddPlaylistBtn');

    const fullPlayer = document.getElementById('fullPlayer');
    const fullPlayerBg = document.getElementById('fullPlayerBg');
    const openFullPlayerBtn = document.getElementById('openFullPlayerBtn');
    const closeFullPlayerBtn = document.getElementById('closeFullPlayerBtn');
    const fullCoverImg = document.getElementById('fullCoverImg');
    const fullSongTitle = document.getElementById('fullSongTitle');
    const fullSongArtist = document.getElementById('fullSongArtist');
    const fullPlayPauseBtn = document.getElementById('fullPlayPauseBtn');
    const fullPlayIcon = document.getElementById('fullPlayIcon');
    const fullPrevBtn = document.getElementById('fullPrevBtn');
    const fullNextBtn = document.getElementById('fullNextBtn');
    const fullProgressFill = document.getElementById('fullProgressFill');
    const fullProgressWrapper = document.getElementById('fullProgressWrapper');
    const fullCurrentTime = document.getElementById('fullCurrentTime');
    const fullTotalTime = document.getElementById('fullTotalTime');

    function init() {
      currentPlaylist = [...songs];
      renderSongs(currentPlaylist);
      renderPlaylists();
      loadSong(currentPlaylist[currentSongIndex]);
      loadUserProfile();
      setupEventListeners();
    }

    function loadUserProfile() {
      const savedName = localStorage.getItem('spotifyCloneProfileName');
      const savedPhoto = localStorage.getItem('spotifyCloneProfilePhoto');
      if (savedName) profileName.textContent = savedName;
      if (savedPhoto) setProfilePhoto(savedPhoto);
      profileMenuInfo.textContent = `Akun demo • ${profileName.textContent}`;
    }

    function setProfilePhoto(photoUrl) {
      let avatarImage = userAvatar.querySelector('img');
      if (!avatarImage) {
        avatarImage = document.createElement('img');
        avatarImage.alt = 'Foto profil';
        userAvatar.replaceChildren(avatarImage);
      }
      avatarImage.src = photoUrl;
    }

    function closeProfileMenu() {
      profileMenu.hidden = true;
      userProfileBtn.setAttribute('aria-expanded', 'false');
    }

    window.switchTab = function(view) {
      currentView = view;
      const mobHome = document.getElementById('mobHome');
      const mobLiked = document.getElementById('mobLiked');
      const navHome = document.getElementById('navHome');

      if (view === 'liked') {
        sectionTitle.textContent = "Lagu Disukai Kamu";
        bannerTitle.textContent = "Koleksi Favorit";
        bannerDesc.textContent = "Daftar lagu yang sudah kamu sukai.";
        mobLiked.classList.add('active');
        mobHome.classList.remove('active');
        if(navHome) navHome.classList.remove('active');
        
        currentPlaylist = songs.filter(s => s.liked);
        renderSongs(currentPlaylist);
      } else {
        sectionTitle.textContent = "Lagu Populer & Rekomendasi";
        bannerTitle.textContent = "Selamat Datang";
        bannerDesc.textContent = "Dengarkan musik favoritmu kapan saja.";
        mobHome.classList.add('active');
        mobLiked.classList.remove('active');
        if(navHome) navHome.classList.add('active');
        
        currentPlaylist = [...songs];
        renderSongs(currentPlaylist);
      }
    }

    function renderSongs(songsToRender) {
      songsGrid.innerHTML = '';
      if(songsToRender.length === 0) {
        songsGrid.innerHTML = '<p style="color: var(--text-secondary); padding: 10px;">Belum ada lagu di koleksi ini.</p>';
        return;
      }

      songsToRender.forEach((song) => {
        const card = document.createElement('div');
        const activeSong = currentPlaylist[currentSongIndex];
        const isActive = activeSong && song.id === activeSong.id;
        card.className = `music-card ${isActive ? 'active-song' : ''}`;
        card.id = `song-card-${song.id}`;
        
        card.innerHTML = `
          <div class="card-left-content">
            <div class="card-img-container">
              <img src="${song.cover}" class="card-img" alt="${song.title}">
              <button class="card-play-btn" onclick="playSelectedSong(${song.id})">
                <i class="fa-solid fa-play"></i>
              </button>
            </div>
            <div class="card-text-container">
              <div class="card-title-row">
                <div class="eq-bars">
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                </div>
                <div class="card-title">${song.title}</div>
              </div>
              <div class="card-desc">${song.artist}</div>
            </div>
          </div>
          <button class="card-options-btn" onclick="openSongMenu(event, ${song.id})" title="Opsi Lainnya">
            <i class="fa-solid fa-ellipsis"></i>
          </button>
        `;

        card.addEventListener('click', (e) => {
          if(!e.target.closest('.card-play-btn') && !e.target.closest('.card-options-btn')) {
            playSelectedSong(song.id);
          }
        });

        songsGrid.appendChild(card);
      });
    }

    window.openSongMenu = function(event, songId) {
      event.stopPropagation();
      activeSongIdForMenu = songId;
      const song = songs.find(s => s.id === songId);
      
      if (song.liked) {
        popupLikeText.textContent = "Hapus dari Lagu Disukai";
        popupLikeBtn.querySelector('i').className = "fa-solid fa-heart-crack";
      } else {
        popupLikeText.textContent = "Simpan ke Lagu Disukai";
        popupLikeBtn.querySelector('i').className = "fa-solid fa-heart";
      }

      const rect = event.currentTarget.getBoundingClientRect();
      songMenuPopup.style.top = `${rect.bottom + 4}px`;
      songMenuPopup.style.left = `${Math.min(rect.left, window.innerWidth - 230)}px`;
      songMenuPopup.hidden = false;
    }

    function updateActiveSongUI() {
      const cards = document.querySelectorAll('.music-card');
      cards.forEach(card => card.classList.remove('active-song'));
      
      const currentSong = currentPlaylist[currentSongIndex];
      if (currentSong) {
        const activeCard = document.getElementById(`song-card-${currentSong.id}`);
        if (activeCard) {
          activeCard.classList.add('active-song');
        }
      }
    }

    function renderPlaylists() {
      playlistList.innerHTML = '';
      const likedCount = songs.filter(s => s.liked).length;
      let playlists = [
        { id: 1, name: "Lagu Disukai", count: `${likedCount} lagu`, icon: "fa-solid fa-heart", action: "liked" },
        { id: 2, name: "Favoritku", count: "Playlist • Pajarson", icon: "fa-solid fa-music", action: "home" }
      ];

      playlists.forEach(pl => {
        const item = document.createElement('div');
        item.className = 'playlist-item';
        item.onclick = () => switchTab(pl.action === 'liked' ? 'liked' : 'home');
        item.innerHTML = `
          <div class="playlist-img">
            <i class="${pl.icon}"></i>
          </div>
          <div class="playlist-info">
            <div class="playlist-name">${pl.name}</div>
            <div class="playlist-meta">${pl.count}</div>
          </div>
        `;
        playlistList.appendChild(item);
      });
    }

    function loadSong(song) {
      if (!song) return;
      playerTitle.textContent = song.title;
      playerArtist.textContent = song.artist;
      playerImg.src = song.cover;
      audio.src = song.url;
      audio.volume = 1.0;

      fullCoverImg.src = song.cover;
      fullPlayerBg.style.backgroundImage = `url('${song.cover}')`;
      fullSongTitle.textContent = song.title;
      fullSongArtist.textContent = song.artist;

      if(song.liked) {
        likeBtn.classList.add('active');
        likeBtn.innerHTML = '<i class="fa-solid fa-heart"></i>';
        fullLikeBtn.classList.add('active');
        fullLikeBtn.innerHTML = '<i class="fa-solid fa-heart"></i>';
      } else {
        likeBtn.classList.remove('active');
        likeBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
        fullLikeBtn.classList.remove('active');
        fullLikeBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
      }

      updateActiveSongUI();
    }

    function playAudio() {
      isPlaying = true;
      audio.play().catch(e => console.log("Gagal memutar audio:", e));
      playIcon.className = 'fa-solid fa-pause';
      fullPlayIcon.className = 'fa-solid fa-pause';
    }

    function pauseAudio() {
      isPlaying = false;
      audio.pause();
      playIcon.className = 'fa-solid fa-play';
      fullPlayIcon.className = 'fa-solid fa-play';
    }

    window.playSelectedSong = function(id) {
      const index = currentPlaylist.findIndex(s => s.id === id);
      if(index !== -1) {
        currentSongIndex = index;
        loadSong(currentPlaylist[currentSongIndex]);
        playAudio();
      }
    }

    function formatTime(seconds) {
      if(isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function toggleLikeCurrentSong() {
      const currentSong = currentPlaylist[currentSongIndex];
      if (currentSong) {
        currentSong.liked = !currentSong.liked;
        loadSong(currentSong);
        renderPlaylists();
        if(currentView === 'liked') {
          currentPlaylist = songs.filter(s => s.liked);
          renderSongs(currentPlaylist);
        }
      }
    }

    function setupEventListeners() {
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.song-menu-popup') && !e.target.closest('.card-options-btn')) {
          songMenuPopup.hidden = true;
        }
      });

      popupLikeBtn.addEventListener('click', () => {
        if (activeSongIdForMenu !== null) {
          const song = songs.find(s => s.id === activeSongIdForMenu);
          if (song) {
            song.liked = !song.liked;
            loadSong(currentPlaylist[currentSongIndex]);
            renderPlaylists();
            if (currentView === 'liked') {
              currentPlaylist = songs.filter(s => s.liked);
              renderSongs(currentPlaylist);
            }
          }
        }
        songMenuPopup.hidden = true;
      });

      popupAddPlaylistBtn.addEventListener('click', () => {
        const song = songs.find(s => s.id === activeSongIdForMenu);
        if (song) {
          alert(`Lagu "${song.title}" berhasil dimasukkan ke playlist/album.`);
        }
        songMenuPopup.hidden = true;
      });

      openFullPlayerBtn.addEventListener('click', () => fullPlayer.classList.add('open'));
      closeFullPlayerBtn.addEventListener('click', () => fullPlayer.classList.remove('open'));

      accountInfoBtn.addEventListener('click', () => {
        alert(`Profil: ${profileName.textContent}\nIni hanya profil demo.`);
        closeProfileMenu();
      });

      userProfileBtn.addEventListener('click', () => {
        const isExpanded = userProfileBtn.getAttribute('aria-expanded') === 'true';
        userProfileBtn.setAttribute('aria-expanded', String(!isExpanded));
        profileMenu.hidden = isExpanded;
      });

      editProfileNameBtn.addEventListener('click', () => {
        const newName = prompt('Masukkan nama profil:', profileName.textContent);
        if (newName === null) return;
        const trimmedName = newName.trim();
        if (!trimmedName) return;
        localStorage.setItem('spotifyCloneProfileName', trimmedName);
        profileName.textContent = trimmedName;
        profileMenuInfo.textContent = `Akun demo • ${trimmedName}`;
        closeProfileMenu();
      });

      changeProfilePhotoBtn.addEventListener('click', () => profilePhotoInput.click());

      profilePhotoInput.addEventListener('change', () => {
        const photo = profilePhotoInput.files[0];
        if (!photo) return;
        const reader = new FileReader();
        reader.onload = () => {
          localStorage.setItem('spotifyCloneProfilePhoto', reader.result);
          setProfilePhoto(reader.result);
          closeProfileMenu();
        };
        reader.readAsDataURL(photo);
      });

      playPauseBtn.addEventListener('click', () => isPlaying ? pauseAudio() : playAudio());
      fullPlayPauseBtn.addEventListener('click', () => isPlaying ? pauseAudio() : playAudio());

      nextBtn.addEventListener('click', () => {
        if (currentPlaylist.length === 0) return;
        currentSongIndex = (currentSongIndex + 1) % currentPlaylist.length;
        loadSong(currentPlaylist[currentSongIndex]);
        playAudio();
      });
      fullNextBtn.addEventListener('click', () => nextBtn.click());

      prevBtn.addEventListener('click', () => {
        if (currentPlaylist.length === 0) return;
        currentSongIndex = (currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
        loadSong(currentPlaylist[currentSongIndex]);
        playAudio();
      });
      fullPrevBtn.addEventListener('click', () => prevBtn.click());

      audio.addEventListener('timeupdate', () => {
        const { currentTime, duration } = audio;
        if(duration) {
          const progressPercent = (currentTime / duration) * 100;
          progressFill.style.width = `${progressPercent}%`;
          fullProgressFill.style.width = `${progressPercent}%`;
          
          currentTimeEl.textContent = formatTime(currentTime);
          totalTimeEl.textContent = formatTime(duration);
          
          fullCurrentTime.textContent = formatTime(currentTime);
          fullTotalTime.textContent = formatTime(duration);
        }
      });

      audio.addEventListener('ended', () => nextBtn.click());

      progressWrapper.addEventListener('click', (e) => {
        const width = progressWrapper.clientWidth;
        const clickX = e.offsetX;
        if(audio.duration) audio.currentTime = (clickX / width) * audio.duration;
      });

      fullProgressWrapper.addEventListener('click', (e) => {
        const width = fullProgressWrapper.clientWidth;
        const clickX = e.offsetX;
        if(audio.duration) audio.currentTime = (clickX / width) * audio.duration;
      });

      volumeWrapper.addEventListener('click', (e) => {
        const width = volumeWrapper.clientWidth;
        const clickX = e.offsetX;
        const vol = Math.max(0, Math.min(1, clickX / width));
        audio.volume = vol;
        volumeFill.style.width = `${vol * 100}%`;
      });

      likeBtn.addEventListener('click', toggleLikeCurrentSong);
      fullLikeBtn.addEventListener('click', toggleLikeCurrentSong);

      searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        let sourceList = currentView === 'liked' ? songs.filter(s => s.liked) : songs;
        const filteredSongs = sourceList.filter(song => 
          song.title.toLowerCase().includes(term) || 
          song.artist.toLowerCase().includes(term)
        );
        renderSongs(filteredSongs);
      });

      addPlaylistBtn.addEventListener('click', () => {
        const newName = prompt('Masukkan nama playlist baru:', 'Playlist Saya');
        if(newName) {
          renderPlaylists();
        }
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
